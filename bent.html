<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hijab Élégance | أناقة الحجاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Tajawal:wght@400;500;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6f7;--ink:#2d1a31;--plum:#4a2650;--rose:#b4707c;--rose-l:#f0dde0;--sage:#6f917f;--line:#e6d3d7;--card:#fff;--r:18px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
[lang=fr] body{font-family:'Tajawal',sans-serif}
[lang=fr] .fr-serif,[lang=fr] h1,[lang=fr] h2{font-family:'Cormorant Garamond',serif}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:rgba(251,246,247,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:'Aref Ruqaa',serif;font-size:1.7rem;color:var(--plum)}
[lang=fr] .logo{font-family:'Cormorant Garamond',serif;font-weight:700;letter-spacing:.5px}
.lang{display:flex;border:1.5px solid var(--plum);border-radius:30px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 16px;font-weight:700;color:var(--plum)}
.lang button.on{background:var(--plum);color:#fff}
.hero{background:linear-gradient(135deg,var(--plum),#7b3f6b 60%,var(--rose));color:#fff;padding:70px 20px 80px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-end:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .in{max-width:1180px;margin:auto;position:relative;z-index:1}
.hero h1{font-size:clamp(2rem,5.5vw,3.6rem);line-height:1.2;max-width:14em;font-weight:700}
.hero p{margin:16px 0 28px;max-width:32em;opacity:.92;font-size:1.1rem}
.cta{display:inline-block;background:#fff;color:var(--plum);padding:12px 30px;border-radius:30px;font-weight:700;text-decoration:none}
.perks{max-width:1180px;margin:-34px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;position:relative;z-index:2}
.perk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;font-weight:500;text-align:center}
section{max-width:1180px;margin:auto;padding:56px 20px}
h2{font-size:1.9rem;color:var(--plum);margin-bottom:6px}
.sub{color:#7b6579;margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .25s,box-shadow .25s;text-align:start;padding:0;display:block;width:100%;font-size:inherit;color:inherit}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(74,38,80,.14)}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--rose-l)}
.card .b{padding:14px 16px 18px}
.card h3{font-size:1.05rem;font-weight:700}
.card .cat{font-size:.85rem;color:var(--rose)}
.price{margin-top:6px;font-weight:700;color:var(--plum);font-size:1.15rem}
.dots{display:flex;gap:6px;margin-top:8px}
.dots i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
footer{background:var(--plum);color:#e9d6ea;text-align:center;padding:30px 20px;font-size:.95rem}
/* modal */
.ov{position:fixed;inset:0;background:rgba(30,12,34,.6);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}
.ov.show{display:flex}
.modal{background:#fff;border-radius:22px;max-width:880px;width:100%;max-height:94vh;overflow:auto;display:grid;grid-template-columns:.9fr 1.1fr;animation:pop .22s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal .pic{background:var(--rose-l);position:relative}
.modal .pic img{width:100%;height:100%;object-fit:cover;display:block;min-height:280px}
.modal form{padding:26px 26px 22px}
.x{position:absolute;top:10px;inset-inline-start:10px;width:36px;height:36px;border-radius:50%;border:0;background:#fff;font-size:1.3rem;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:2}
.modal h3{font-size:1.4rem;color:var(--plum)}
.modal .p{color:var(--rose);font-weight:700;margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:.88rem;font-weight:500;margin:10px 0 4px}
input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{border-color:var(--rose);outline:none}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw label{margin:0;position:relative}
.sw input{position:absolute;opacity:0}
.sw span{display:block;width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw input:checked+span{box-shadow:0 0 0 3px var(--plum)}
.sw input:focus-visible+span{box-shadow:0 0 0 3px var(--rose)}
.cn{font-size:.85rem;color:#7b6579;margin-top:4px;min-height:1.3em}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:1.3rem}
.qty input{text-align:center;width:70px}
.tot{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px;padding:12px 14px;background:var(--rose-l);border-radius:12px;font-weight:700;color:var(--plum)}
.go{width:100%;padding:14px;border:0;border-radius:14px;background:var(--plum);color:#fff;font-size:1.05rem;font-weight:700}
.go:hover{background:#5c2f63}
.err{color:#b3261e;font-size:.85rem;margin-top:8px;min-height:1.2em}
.ok{padding:50px 26px;text-align:center;grid-column:1/-1}
.ok b{display:grid;place-items:center;width:70px;height:70px;border-radius:50%;background:var(--sage);color:#fff;font-size:2rem;margin:0 auto 16px}
@media(max-width:700px){.modal{grid-template-columns:1fr}.modal .pic img{min-height:0;aspect-ratio:16/10}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo" id="logo">أناقة الحجاب</div>
  <div class="lang" role="group" aria-label="Language"><button data-l="ar" class="on">العربية</button><button data-l="fr">Français</button></div>
</div></header>

<div class="hero"><div class="in">
  <h1 data-t="h1"></h1>
  <p data-t="h1p"></p>
  <a class="cta" href="#shop" data-t="shop"></a>
</div></div>
<div class="perks">
  <div class="perk" data-t="p1"></div><div class="perk" data-t="p2"></div><div class="perk" data-t="p3"></div>
</div>

<section id="shop">
  <h2 data-t="coll"></h2>
  <p class="sub" data-t="collp"></p>
  <div class="grid" id="grid"></div>
</section>
<footer data-t="foot"></footer>

<div class="ov" id="ov" role="dialog" aria-modal="true">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ============ الإعدادات / Config ============ */
const STORE_KEY='hijab_orders';
/* لربط الموقع بسيرفر حقيقي ضع رابط الـ API هنا (POST JSON). اتركه فارغاً للتخزين المحلي */
const API_URL='';

/* ============ المنتجات / Products ============ */
const sizesStd=['S','M','L','XL'];
const C={
 rose:{ar:'وردي',fr:'Rose',hex:'#e8b4bc'},black:{ar:'أسود',fr:'Noir',hex:'#1f1b20'},
 ivory:{ar:'عاجي',fr:'Ivoire',hex:'#f3ead9'},sage:{ar:'أخضر زيتي',fr:'Vert sauge',hex:'#8aa596'},
 plum:{ar:'بنفسجي',fr:'Prune',hex:'#6b3a73'},navy:{ar:'كحلي',fr:'Bleu nuit',hex:'#223052'},
 sand:{ar:'بيج',fr:'Beige',hex:'#cdb79a'},wine:{ar:'عنابي',fr:'Bordeaux',hex:'#7a2538'}
};
/* لوضع صورك الخاصة: ضع رابط الصورة في الحقل img لكل منتج */
const PRODUCTS=[
 {id:1,ar:'حجاب شيفون حريري',fr:'Hijab chiffon soyeux',cat:['حجاب','Hijab'],price:1200,sizes:['140×140','180×70'],colors:['rose','black','ivory','sage'],img:''},
 {id:2,ar:'خمار طويل مزدوج',fr:'Khimar long double couche',cat:['خمار','Khimar'],price:2400,sizes:['S','M','L','XL'],colors:['black','navy','plum','wine'],img:''},
 {id:3,ar:'حجاب جيرسي مريح',fr:'Hijab jersey confort',cat:['حجاب','Hijab'],price:900,sizes:['180×70'],colors:['black','sand','sage','rose','wine'],img:''},
 {id:4,ar:'خمار ساتان فاخر',fr:'Khimar satin de luxe',cat:['خمار','Khimar'],price:3200,sizes:sizesStd,colors:['ivory','plum','navy'],img:''},
 {id:5,ar:'حجاب كريب مطرّز',fr:'Hijab crêpe brodé',cat:['حجاب','Hijab'],price:1800,sizes:['140×140','180×70'],colors:['sand','wine','black'],img:''},
 {id:6,ar:'خمار صلاة بسيط',fr:'Khimar de prière',cat:['خمار','Khimar'],price:1500,sizes:sizesStd,colors:['ivory','rose','sage'],img:''},
 {id:7,ar:'حجاب قطن صيفي',fr:'Hijab coton d’été',cat:['حجاب','Hijab'],price:800,sizes:['180×70'],colors:['ivory','sand','rose','navy'],img:''},
 {id:8,ar:'خمار مخملي شتوي',fr:'Khimar velours d’hiver',cat:['خمار','Khimar'],price:2900,sizes:sizesStd,colors:['plum','wine','black'],img:''}
];

/* صورة بديلة مرسومة بالألوان */
function ph(hex,i){
 const d=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${hex}'/><stop offset='1' stop-color='${hex}' stop-opacity='.55'/></linearGradient></defs><rect width='400' height='500' fill='#f3e6e9'/><path d='M200 70c-70 0-110 55-110 130 0 40 12 70 12 105 0 55-45 80-70 145h336c-25-65-70-90-70-145 0-35 12-65 12-105 0-75-40-130-110-130z' fill='url(#g)'/><ellipse cx='200' cy='215' rx='48' ry='62' fill='#f6dccb'/><path d='M200 70c-70 0-110 55-110 130 0 25 4 45 8 65 30-70 70-78 102-78s72 8 102 78c4-20 8-40 8-65 0-75-40-130-110-130z' fill='${hex}'/></svg>`;
 return 'data:image/svg+xml;utf8,'+encodeURIComponent(d);
}
const imgOf=(p,ck)=>p.img||ph(C[ck||p.colors[0]].hex);

/* ============ الولايات / Wilayas ============ */
const W=`أدرار|Adrar;الشلف|Chlef;الأغواط|Laghouat;أم البواقي|Oum El Bouaghi;باتنة|Batna;بجاية|Béjaïa;بسكرة|Biskra;بشار|Béchar;البليدة|Blida;البويرة|Bouira;تمنراست|Tamanrasset;تبسة|Tébessa;تلمسان|Tlemcen;تيارت|Tiaret;تيزي وزو|Tizi Ouzou;الجزائر|Alger;الجلفة|Djelfa;جيجل|Jijel;سطيف|Sétif;سعيدة|Saïda;سكيكدة|Skikda;سيدي بلعباس|Sidi Bel Abbès;عنابة|Annaba;قالمة|Guelma;قسنطينة|Constantine;المدية|Médéa;مستغانم|Mostaganem;المسيلة|M'Sila;معسكر|Mascara;ورقلة|Ouargla;وهران|Oran;البيض|El Bayadh;إيليزي|Illizi;برج بوعريريج|Bordj Bou Arréridj;بومرداس|Boumerdès;الطارف|El Tarf;تندوف|Tindouf;تيسمسيلت|Tissemsilt;الوادي|El Oued;خنشلة|Khenchela;سوق أهراس|Souk Ahras;تيبازة|Tipaza;ميلة|Mila;عين الدفلى|Aïn Defla;النعامة|Naâma;عين تموشنت|Aïn Témouchent;غرداية|Ghardaïa;غليزان|Relizane;تيميمون|Timimoun;برج باجي مختار|Bordj Badji Mokhtar;أولاد جلال|Ouled Djellal;بني عباس|Béni Abbès;عين صالح|In Salah;عين قزام|In Guezzam;تقرت|Touggourt;جانت|Djanet;المغير|El M'Ghair;المنيعة|El Menia`
 .split(';').map((s,i)=>{const[a,f]=s.split('|');return{code:String(i+1).padStart(2,'0'),ar:a,fr:f}});

/* بلديات (أمثلة) — للولايات الأخرى يكتب الزبون اسم البلدية يدوياً.
   لإضافة كل البلديات: أضف مفتاح رمز الولاية ومصفوفة البلديات */
const COMM={
 '03':['الأغواط','قصر الحيران','بن ناصر بن شهرة','سيدي مخلوف','حاسي الدلاعة','حاسي الرمل','عين ماضي','تاجموت','الخنق','قلتة سيدي سعد','عين سيدي علي','البيضاء','بريدة','الغيشة','الحويطة','تاجرونة','وادي مزي','وادي مرة','سبقاق','آفلو'],
 '16':['الجزائر الوسطى','باب الوادي','باب الزوار','الحراش','القبة','حسين داي','بئر مراد رايس','الدار البيضاء','الرويبة','بئر خادم'],
 '31':['وهران','بئر الجير','السانية','أرزيو','عين الترك','قديل','بوتليليس'],
 '25':['قسنطينة','الخروب','عين سمارة','حامة بوزيان','زيغود يوسف'],
 '09':['البليدة','بوفاريك','موزاية','الأربعاء','بني مراد','الصومعة'],
 '19':['سطيف','العلمة','عين ولمان','عين أرنات','بوعنداس'],
 '05':['باتنة','عين التوتة','بريكة','مروانة','أريس'],
 '47':['غرداية','بونورة','القرارة','متليلي','بريان','العطف'],
 '17':['الجلفة','مسعد','عين وسارة','حاسي بحبح','دار الشيوخ'],
 '07':['بسكرة','طولقة','سيدي عقبة','أورلال','زريبة الوادي'],
 '30':['ورقلة','حاسي مسعود','الرويسات','سيدي خويلد'],
 '23':['عنابة','البوني','الحجار','سيدي عمار','برحال']
};

/* ============ الترجمة / i18n ============ */
const T={
 ar:{logo:'أناقة الحجاب',h1:'أناقة تليق بكِ، وستر يزيدكِ جمالاً',h1p:'حجابات وخمارات بأقمشة ناعمة وألوان هادئة، تصلكِ إلى باب بيتك في كل ولايات الوطن.',shop:'تسوّقي الآن',p1:'توصيل لـ 58 ولاية',p2:'الدفع عند الاستلام',p3:'أقمشة مختارة بعناية',coll:'مجموعتنا',collp:'اضغطي على صورة المنتج لإتمام الطلب',foot:'© 2026 أناقة الحجاب — جميع الحقوق محفوظة',
  da:'دج',name:'الاسم',sur:'اللقب',phone:'رقم الهاتف',wil:'الولاية',wilp:'اختر الولاية',com:'البلدية',comp:'اكتب أو اختر البلدية',size:'القياس',color:'اللون',qty:'الكمية',total:'المجموع',send:'تأكيد الطلب',
  e_name:'أدخل الاسم واللقب',e_phone:'رقم الهاتف غير صحيح (مثال: 0555123456)',e_wil:'اختر الولاية',e_com:'أدخل البلدية',
  okt:'تم استلام طلبك بنجاح!',okp:'سنتصل بك قريباً على رقم هاتفك لتأكيد الطلب. شكراً لثقتك.',close:'إغلاق'},
 fr:{logo:'Hijab Élégance',h1:'Une élégance qui vous ressemble, une pudeur qui vous sublime',h1p:'Hijabs et khimars aux tissus doux et aux teintes apaisantes, livrés chez vous dans toutes les wilayas.',shop:'Découvrir la collection',p1:'Livraison dans 58 wilayas',p2:'Paiement à la livraison',p3:'Tissus soigneusement choisis',coll:'Notre collection',collp:'Cliquez sur une photo pour commander',foot:'© 2026 Hijab Élégance — Tous droits réservés',
  da:'DA',name:'Prénom',sur:'Nom',phone:'Téléphone',wil:'Wilaya',wilp:'Choisir la wilaya',com:'Commune',comp:'Saisir ou choisir la commune',size:'Taille',color:'Couleur',qty:'Quantité',total:'Total',send:'Confirmer la commande',
  e_name:'Saisissez le prénom et le nom',e_phone:'Numéro invalide (ex : 0555123456)',e_wil:'Choisissez la wilaya',e_com:'Saisissez la commune',
  okt:'Commande bien reçue !',okp:'Nous vous appellerons bientôt pour confirmer votre commande. Merci de votre confiance.',close:'Fermer'}
};
let L=localStorage.getItem('lang')||'ar';
const t=k=>T[L][k];
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString(L==='ar'?'ar-DZ':'fr-FR')+' '+t('da');

function applyLang(){
 document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 $('#logo').textContent=t('logo');
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
 document.title=t('logo');
 renderGrid();
 if($('#ov').classList.contains('show')&&cur)openModal(cur.id,true);
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;localStorage.setItem('lang',L);applyLang()});

function renderGrid(){
 $('#grid').innerHTML=PRODUCTS.map(p=>`<button class="card" data-id="${p.id}">
  <img src="${imgOf(p)}" alt="${L==='ar'?p.ar:p.fr}" loading="lazy">
  <div class="b"><div class="cat">${L==='ar'?p.cat[0]:p.cat[1]}</div><h3>${L==='ar'?p.ar:p.fr}</h3>
  <div class="price">${fmt(p.price)}</div>
  <div class="dots">${p.colors.map(c=>`<i style="background:${C[c].hex}"></i>`).join('')}</div></div></button>`).join('');
 document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openModal(+c.dataset.id));
}

/* ============ نافذة الطلب ============ */
let cur=null;
function openModal(id,keep){
 const p=PRODUCTS.find(x=>x.id===id);const old=keep?collect():null;cur=p;
 $('#modal').innerHTML=`
 <div class="pic"><button class="x" type="button" aria-label="${t('close')}" id="cl">×</button><img id="pimg" src="${imgOf(p,old?.color)}" alt=""></div>
 <form id="f" novalidate>
  <h3>${L==='ar'?p.ar:p.fr}</h3><div class="p">${fmt(p.price)}</div>
  <div class="row"><div><label for="n">${t('name')}</label><input id="n" autocomplete="given-name"></div>
  <div><label for="s">${t('sur')}</label><input id="s" autocomplete="family-name"></div></div>
  <label for="ph">${t('phone')}</label><input id="ph" type="tel" inputmode="tel" dir="ltr" maxlength="10" placeholder="0555 12 34 56" style="text-align:start">
  <div class="row"><div><label for="w">${t('wil')}</label><select id="w"><option value="">${t('wilp')}</option>${W.map(w=>`<option value="${w.code}">${w.code} - ${L==='ar'?w.ar:w.fr}</option>`).join('')}</select></div>
  <div><label for="c">${t('com')}</label><input id="c" list="cl-list" placeholder="${t('comp')}"><datalist id="cl-list"></datalist></div></div>
  <div class="row"><div><label for="sz">${t('size')}</label><select id="sz">${p.sizes.map(s=>`<option>${s}</option>`).join('')}</select></div>
  <div><label>${t('qty')}</label><div class="qty"><button type="button" id="mn">−</button><input id="q" type="number" min="1" max="20" value="1"><button type="button" id="pl">+</button></div></div></div>
  <label>${t('color')}</label>
  <div class="sw">${p.colors.map((c,i)=>`<label title="${C[c][L]}"><input type="radio" name="col" value="${c}" ${i?'':'checked'}><span style="background:${C[c].hex}"></span></label>`).join('')}</div>
  <div class="cn" id="cn">${C[p.colors[0]][L]}</div>
  <div class="tot"><span>${t('total')}</span><span id="tt"></span></div>
  <button class="go" type="submit">${t('send')}</button><div class="err" id="er"></div>
 </form>`;
 $('#ov').classList.add('show');document.body.style.overflow='hidden';
 const f=$('#f');
 const upd=()=>{$('#tt').textContent=fmt(p.price*(Math.max(1,+$('#q').value||1)))};
 $('#w').onchange=()=>{const l=COMM[$('#w').value]||[];$('#cl-list').innerHTML=l.map(x=>`<option value="${x}">`).join('');$('#c').value=''};
 $('#mn').onclick=()=>{$('#q').value=Math.max(1,+$('#q').value-1);upd()};
 $('#pl').onclick=()=>{$('#q').value=Math.min(20,+$('#q').value+1);upd()};
 $('#q').oninput=upd;
 f.querySelectorAll('[name=col]').forEach(r=>r.onchange=()=>{$('#cn').textContent=C[r.value][L];$('#pimg').src=imgOf(p,r.value)});
 $('#cl').onclick=closeModal;
 f.onsubmit=e=>{e.preventDefault();submit()};
 if(old){for(const k of ['n','s','ph','c','sz','q'])if(old[k]!=null)$('#'+k).value=old[k];
  if(old.w){$('#w').value=old.w;$('#w').onchange();$('#c').value=old.c}
  const r=f.querySelector(`[name=col][value=${old.color}]`);if(r){r.checked=true;$('#cn').textContent=C[old.color][L]}}
 upd();
}
function collect(){const g=id=>$('#'+id)?.value;return{n:g('n'),s:g('s'),ph:g('ph'),w:g('w'),c:g('c'),sz:g('sz'),q:g('q'),color:document.querySelector('[name=col]:checked')?.value}}
function closeModal(){$('#ov').classList.remove('show');document.body.style.overflow='';cur=null}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

async function submit(){
 const v=collect(),er=m=>$('#er').textContent=m;
 if(v.n.trim().length<2||v.s.trim().length<2)return er(t('e_name'));
 if(!/^0[567]\d{8}$/.test(v.ph.replace(/\s/g,'')))return er(t('e_phone'));
 if(!v.w)return er(t('e_wil'));
 if(v.c.trim().length<2)return er(t('e_com'));
 const w=W.find(x=>x.code===v.w),q=Math.max(1,+v.q||1);
 const order={id:'C'+Date.now().toString(36).toUpperCase(),date:new Date().toISOString(),
  name:v.n.trim(),surname:v.s.trim(),phone:v.ph.replace(/\s/g,''),
  wilayaCode:w.code,wilayaAr:w.ar,wilayaFr:w.fr,commune:v.c.trim(),
  productId:cur.id,productAr:cur.ar,productFr:cur.fr,size:v.sz,
  colorAr:C[v.color].ar,colorFr:C[v.color].fr,colorHex:C[v.color].hex,
  qty:q,total:cur.price*q,status:'pending'};
 try{
  if(API_URL){await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(order)})}
  else{const a=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');a.unshift(order);localStorage.setItem(STORE_KEY,JSON.stringify(a))}
 }catch(e){return er('Erreur / خطأ')}
 $('#modal').innerHTML=`<div class="ok"><b>✓</b><h3>${t('okt')}</h3><p style="margin:8px 0 20px">${t('okp')}</p><button class="go" style="max-width:220px" id="cl2">${t('close')}</button></div>`;
 $('#cl2').onclick=closeModal;
}
applyLang();
</script>
</body>
</html>
