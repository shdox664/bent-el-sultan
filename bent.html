<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الطلبات | Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1f3;--ink:#2d1a31;--plum:#4a2650;--rose:#b4707c;--line:#e6d3d7;--ok:#2f7d57;--no:#b3261e;--wait:#b7791f}
*{box-sizing:border-box;margin:0}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.top{background:var(--plum);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:1.3rem}
.top button{background:rgba(255,255,255,.15);color:#fff;border:0;padding:8px 16px;border-radius:10px}
main{max-width:1100px;margin:auto;padding:22px 16px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.st{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.st b{display:block;font-size:1.7rem;color:var(--plum)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1.5px solid var(--plum);background:#fff;color:var(--plum);padding:7px 18px;border-radius:30px;font-weight:700}
.tabs button.on{background:var(--plum);color:#fff}
.list{display:grid;gap:14px}
.o{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:14px;border-inline-start:6px solid var(--wait)}
.o.confirmed{border-inline-start-color:var(--ok)}.o.cancelled{border-inline-start-color:var(--no);opacity:.8}
.o h3{font-size:1.1rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font-size:.78rem;padding:2px 10px;border-radius:20px;background:#f7ebd2;color:var(--wait);font-weight:700}
.confirmed .tag{background:#dcf1e6;color:var(--ok)}.cancelled .tag{background:#f8dcd9;color:var(--no)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px 18px;margin-top:8px;font-size:.93rem}
.meta span{color:#7b6579}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:-2px;border:1px solid rgba(0,0,0,.2)}
.act{display:flex;flex-direction:column;gap:8px;justify-content:center;min-width:110px}
.act button{border:0;padding:9px 14px;border-radius:10px;font-weight:700;color:#fff}
.b-ok{background:var(--ok)}.b-no{background:var(--no)}.b-re{background:#7b6579}
.empty{text-align:center;padding:60px 10px;color:#7b6579;background:#fff;border-radius:16px;border:1px dashed var(--line)}
.lock{max-width:340px;margin:18vh auto;background:#fff;padding:28px;border-radius:18px;border:1px solid var(--line);text-align:center}
.lock input{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:12px;margin:14px 0 10px;font:inherit;text-align:center}
.lock button{width:100%;padding:12px;border:0;border-radius:12px;background:var(--plum);color:#fff;font-weight:700}
@media(max-width:620px){.o{grid-template-columns:1fr}.act{flex-direction:row}.act button{flex:1}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const STORE_KEY='hijab_orders';
/* كلمة سر بسيطة للتجربة فقط — غيّرها. للحماية الحقيقية استعمل سيرفر مع تسجيل دخول */
const ADMIN_PASS='admin123';
const ST={pending:'قيد الانتظار',confirmed:'تم التأكيد',cancelled:'ملغى'};
let filter='all';
const $=s=>document.querySelector(s);
const load=()=>JSON.parse(localStorage.getItem(STORE_KEY)||'[]');
const save=a=>localStorage.setItem(STORE_KEY,JSON.stringify(a));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function login(){
 $('#app').innerHTML=`<form class="lock" id="lf"><h2>لوحة الإدارة</h2><input type="password" id="pw" placeholder="كلمة السر" autofocus><button>دخول</button><p id="le" style="color:#b3261e;margin-top:8px"></p></form>`;
 $('#lf').onsubmit=e=>{e.preventDefault();if($('#pw').value===ADMIN_PASS){sessionStorage.setItem('adm','1');render()}else $('#le').textContent='كلمة السر خاطئة'};
}
function render(){
 if(sessionStorage.getItem('adm')!=='1')return login();
 const all=load(),cnt=s=>all.filter(o=>o.status===s).length;
 const shown=filter==='all'?all:all.filter(o=>o.status===filter);
 const sum=all.filter(o=>o.status==='confirmed').reduce((a,o)=>a+o.total,0);
 $('#app').innerHTML=`
 <div class="top"><h1>لوحة الطلبات</h1><div><button id="rf">تحديث</button> <button id="lo">خروج</button></div></div>
 <main>
  <div class="stats">
   <div class="st"><b>${all.length}</b>كل الطلبات</div>
   <div class="st"><b>${cnt('pending')}</b>قيد الانتظار</div>
   <div class="st"><b>${cnt('confirmed')}</b>تم التأكيد</div>
   <div class="st"><b>${cnt('cancelled')}</b>ملغاة</div>
   <div class="st"><b>${sum.toLocaleString('ar-DZ')}</b>مبيعات مؤكدة (دج)</div>
  </div>
  <div class="tabs">${[['all','الكل'],['pending','قيد الانتظار'],['confirmed','تم'],['cancelled','ملغى']].map(([k,l])=>`<button data-f="${k}" class="${filter===k?'on':''}">${l}</button>`).join('')}</div>
  <div class="list">${shown.length?shown.map(card).join(''):'<div class="empty">لا توجد طلبات هنا بعد</div>'}</div>
 </main>`;
 $('#rf').onclick=render;$('#lo').onclick=()=>{sessionStorage.removeItem('adm');login()};
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});
 document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>setStatus(b.dataset.id,b.dataset.s));
}
function card(o){
 const d=new Date(o.date).toLocaleString('ar-DZ',{dateStyle:'medium',timeStyle:'short'});
 const btns=o.status==='pending'
  ?`<button class="b-ok" data-id="${o.id}" data-s="confirmed">تم ✓</button><button class="b-no" data-id="${o.id}" data-s="cancelled">إلغاء ✕</button>`
  :`<button class="b-re" data-id="${o.id}" data-s="pending">إعادة للانتظار</button>`;
 return `<article class="o ${o.status}"><div>
  <h3>${esc(o.name)} ${esc(o.surname)} <span class="tag">${ST[o.status]}</span></h3>
  <div class="meta">
   <div><span>الهاتف:</span> <a href="tel:${esc(o.phone)}" dir="ltr">${esc(o.phone)}</a></div>
   <div><span>الولاية:</span> ${esc(o.wilayaCode)} - ${esc(o.wilayaAr)}</div>
   <div><span>البلدية:</span> ${esc(o.commune)}</div>
   <div><span>المنتج:</span> ${esc(o.productAr)}</div>
   <div><span>القياس:</span> ${esc(o.size)}</div>
   <div><span>اللون:</span> <i class="dot" style="background:${esc(o.colorHex)}"></i> ${esc(o.colorAr)}</div>
   <div><span>الكمية:</span> ${o.qty}</div>
   <div><span>المجموع:</span> <b>${o.total.toLocaleString('ar-DZ')} دج</b></div>
   <div><span>التاريخ:</span> ${d}</div>
  </div></div><div class="act">${btns}</div></article>`;
}
function setStatus(id,s){const a=load(),o=a.find(x=>x.id===id);if(o){o.status=s;save(a);render()}}
window.addEventListener('storage',e=>{if(e.key===STORE_KEY&&sessionStorage.getItem('adm')==='1')render()});
render();
</script>
</body>
</html>
