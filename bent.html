<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hijab Élégance | أناقة الحجاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Tajawal:wght@400;500;700;800&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script>
<style>
:root{--bg:#fbf6f7;--bg2:#f4e9ec;--ink:#2d1a31;--mute:#7b6579;--head:#4a2650;--brand:#4a2650;--brand-h:#5f3368;--on:#fff;--rose:#b4707c;--card:#fff;--line:#ead8dc;--sage:#4f8a6d;--shadow:0 14px 34px rgba(74,38,80,.16);--r:20px}
[data-theme=dark]{--bg:#150f18;--bg2:#1e1623;--ink:#f3e9f4;--mute:#b5a2b8;--head:#e8c3ee;--brand:#c98bd3;--brand-h:#d8a3e1;--on:#25122a;--rose:#e0959f;--card:#201826;--line:#35283b;--sage:#6fc097;--shadow:0 14px 34px rgba(0,0,0,.55)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;transition:background .25s,color .25s}
[lang=fr] h1,[lang=fr] h2,[lang=fr] .logo{font-family:'Cormorant Garamond',serif}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
.logo{font-family:'Aref Ruqaa',serif;font-size:1.65rem;color:var(--head);margin-inline-end:auto;text-decoration:none}
[lang=fr] .logo{font-weight:700;font-size:1.8rem}
.lang{display:flex;border:1.5px solid var(--head);border-radius:30px;overflow:hidden}
.lang button{border:0;background:none;padding:5px 14px;font-weight:700;color:var(--head)}
.lang button.on{background:var(--head);color:var(--bg)}
.ico{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:1.1rem;display:grid;place-items:center}

/* hero */
.hero{max-width:1200px;margin:22px auto 0;padding:0 20px}
.hero .box{background:linear-gradient(120deg,#2f1436,#5a2d62 55%,#a96672);border-radius:32px;color:#fff;display:grid;grid-template-columns:1.05fr .95fr;gap:24px;align-items:center;padding:clamp(26px,5vw,64px);overflow:hidden;position:relative;isolation:isolate}
.hero .box::before,.hero .box::after{content:"";position:absolute;border-radius:50%;z-index:-1;filter:blur(2px)}
.hero .box::before{width:380px;height:380px;background:rgba(255,255,255,.07);top:-140px;inset-inline-start:-100px}
.hero .box::after{width:260px;height:260px;background:rgba(255,214,222,.10);bottom:-110px;inset-inline-end:30%}
.eyebrow{display:inline-block;font-size:.88rem;letter-spacing:.04em;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:4px 16px;border-radius:30px;margin-bottom:16px}
.hero h1{font-size:clamp(1.9rem,4.8vw,3.3rem);line-height:1.25;font-weight:800}
[lang=fr] .hero h1{font-weight:700;font-size:clamp(2.2rem,5vw,3.7rem);line-height:1.1}
.hero p{margin:14px 0 26px;opacity:.93;font-size:1.08rem;max-width:30em}
.cta{display:inline-block;background:#fff;color:#4a2650;padding:14px 34px;border-radius:30px;font-weight:800;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.25);transition:transform .2s}
.cta:hover{transform:translateY(-2px)}
.col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.col img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:22px;display:block;box-shadow:0 14px 30px rgba(0,0,0,.35);border:3px solid rgba(255,255,255,.85)}
.col img:nth-child(2){margin-top:34px}

/* perks */
.perks{max-width:1200px;margin:18px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.perk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;display:flex;gap:12px;align-items:center;font-weight:700}
.perk i{font-style:normal;font-size:1.5rem;width:44px;height:44px;border-radius:50%;background:var(--bg2);display:grid;place-items:center}

/* categories */
.tiles{max-width:1200px;margin:auto;padding:46px 20px 0;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tile{position:relative;border:0;border-radius:26px;overflow:hidden;aspect-ratio:16/10;display:block;width:100%;padding:0;cursor:pointer;background:var(--bg2)}
.tile img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block;transition:transform .6s}
.tile:hover img{transform:scale(1.07)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(35,12,42,.78),transparent 60%)}
.tile span{position:absolute;z-index:2;bottom:18px;inset-inline-start:22px;color:#fff;font-size:1.7rem;font-weight:800;text-align:start;line-height:1.2}
.tile small{display:block;font-size:.92rem;font-weight:400;opacity:.9;margin-top:2px}
[lang=fr] .tile span{font-family:'Cormorant Garamond',serif;font-size:2rem}

section{max-width:1200px;margin:auto;padding:46px 20px 56px}
.head{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:24px}
h2{font-size:1.9rem;color:var(--head);line-height:1.2}
[lang=fr] h2{font-size:2.3rem}
.sub{color:var(--mute)}
.chips{display:flex;gap:8px}
.chips button{border:1.5px solid var(--line);background:var(--card);padding:7px 20px;border-radius:30px;font-weight:700}
.chips button.on{background:var(--brand);border-color:var(--brand);color:var(--on)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .25s,box-shadow .25s;text-align:start;padding:0;display:block;width:100%;font-size:inherit}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.ph{position:relative;overflow:hidden;background:var(--bg2);aspect-ratio:4/5}
.ph img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;transition:transform .6s}
.card:hover .ph img{transform:scale(1.07)}
.badge{position:absolute;top:12px;inset-inline-start:12px;background:var(--rose);color:#fff;font-size:.8rem;font-weight:800;padding:3px 12px;border-radius:20px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.card .b{padding:14px 16px 16px}
.cat{font-size:.85rem;color:var(--rose);font-weight:500}
.card h3{font-size:1.05rem;font-weight:700;margin-top:2px}
.row2{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.price{font-weight:800;color:var(--head);font-size:1.15rem}
.old{color:var(--mute);text-decoration:line-through;font-size:.85rem;margin-inline-start:6px;font-weight:400}
.dots{display:flex;gap:5px}
.dots i{width:15px;height:15px;border-radius:50%;border:1px solid rgba(128,128,128,.35)}
.buy{margin-top:12px;width:100%;padding:10px;border-radius:12px;border:0;background:var(--brand);color:var(--on);font-weight:700;text-align:center}
.card:hover .buy{background:var(--brand-h)}

/* story band */
.band{max-width:1200px;margin:0 auto;padding:0 20px 56px}
.band .in{background:var(--bg2);border:1px solid var(--line);border-radius:30px;display:grid;grid-template-columns:.9fr 1.1fr;gap:0;overflow:hidden;align-items:stretch}
.band img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;min-height:280px}
.band .tx{padding:clamp(24px,4vw,52px);align-self:center}
.band h2{margin-bottom:10px}
.band p{color:var(--mute);margin-bottom:18px}
.band ul{list-style:none;padding:0;display:grid;gap:8px}
.band li{font-weight:700;display:flex;gap:10px;align-items:center}
.band li::before{content:"✓";display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sage);color:#fff;font-size:.8rem;flex:none}

footer{background:var(--bg2);border-top:1px solid var(--line);text-align:center;padding:30px 20px;color:var(--mute)}
footer small{display:block;margin-top:6px;font-size:.82rem;opacity:.8}
.wa{position:fixed;bottom:18px;inset-inline-end:18px;z-index:25;width:54px;height:54px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;font-size:1.6rem;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.3)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(15,6,18,.62);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}
.ov.show{display:flex}
.modal{background:var(--card);border-radius:24px;max-width:900px;width:100%;max-height:94vh;overflow:auto;display:grid;grid-template-columns:.9fr 1.1fr;animation:pop .22s ease}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal .pic{background:var(--bg2);position:relative}
.modal .pic img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;min-height:300px}
.modal form{padding:26px}
.x{position:absolute;top:12px;inset-inline-start:12px;width:38px;height:38px;border-radius:50%;border:0;background:var(--card);font-size:1.3rem;box-shadow:0 2px 10px rgba(0,0,0,.3);z-index:2}
.modal h3{font-size:1.45rem;color:var(--head);line-height:1.3}
.modal .p{color:var(--rose);font-weight:800;margin-bottom:8px;font-size:1.15rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:.88rem;font-weight:500;margin:11px 0 4px;color:var(--mute)}
input,select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:var(--ink)}
input:focus,select:focus{border-color:var(--rose);outline:none}
.bad{border-color:#d64545!important}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sizes label,.sw label{margin:0;position:relative;color:inherit}
.sizes input,.sw input{position:absolute;opacity:0}
.sizes span{display:block;min-width:52px;text-align:center;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;font-weight:700;background:var(--bg)}
.sizes input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--on)}
.sizes input:focus-visible+span,.sw input:focus-visible+span{outline:3px solid var(--rose);outline-offset:2px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw span{display:block;width:36px;height:36px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.sw input:checked+span{box-shadow:0 0 0 3px var(--brand)}
.cn{font-size:.88rem;color:var(--mute);margin-top:5px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:1.3rem}
.qty input{text-align:center;width:70px}
.tot{display:flex;justify-content:space-between;align-items:center;margin:18px 0 12px;padding:13px 16px;background:var(--bg2);border-radius:14px;font-weight:800;color:var(--head)}
.go{width:100%;padding:15px;border:0;border-radius:14px;background:var(--brand);color:var(--on);font-size:1.05rem;font-weight:800}
.go:hover{background:var(--brand-h)}
.err{color:#e05555;font-size:.88rem;margin-top:8px;min-height:1.2em}
.ok{padding:56px 26px;text-align:center;grid-column:1/-1}
.ok b{display:grid;place-items:center;width:74px;height:74px;border-radius:50%;background:var(--sage);color:#fff;font-size:2.1rem;margin:0 auto 16px}
@media(max-width:760px){
 .hero .box{grid-template-columns:1fr}.col{display:none}
 .tiles{grid-template-columns:1fr 1fr;gap:10px}.tile{aspect-ratio:4/5}.tile span{font-size:1.2rem;bottom:12px;inset-inline-start:14px}.tile small{display:none}
 .band .in{grid-template-columns:1fr}.band img{min-height:0;aspect-ratio:16/10}
 .ov{align-items:flex-end;padding:0}
 .modal{grid-template-columns:1fr;border-radius:24px 24px 0 0;max-height:92vh}
 .modal .pic img{min-height:0;aspect-ratio:16/10}
 .grid{grid-template-columns:repeat(2,1fr);gap:12px}
 .card h3{font-size:.95rem}.row2{flex-direction:column;align-items:flex-start}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" id="logo" href="#"></a>
  <div class="lang" role="group" aria-label="Language"><button data-l="ar" class="on">عربي</button><button data-l="fr">FR</button></div>

</div></header>

<div class="hero"><div class="box">
  <div><span class="eyebrow" data-t="eye"></span><h1 data-t="h1"></h1><p data-t="h1p"></p><a class="cta" href="#shop" data-t="shop"></a></div>

<script>
/* ============ الإعدادات / Config ============ */
const STORE_KEY='hijab_orders';
const API_URL='';                 /* رابط الـ API لاستقبال الطلبات (اختياري) */
const WHATSAPP='213555000000';    /* رقم واتساب المتجر بصيغة دولية بدون + */
const SIZES=['S','M','L','XL'];

/* ============ صور حقيقية مخصصة للمحجبات (Hijab & Khimar Fashion) ============ */
const u=(id,w=900)=>`https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=${w}&q=80`;
const IMG={
  p1:u('1585487000160-6ebcfceb0d03'), p2:u('1583391733956-3750e0ff4e8b'), p3:u('1565084888279-aca607ecce0c'), p4:u('1584273143981-41c073dfe8f8'),
  p5:u('1609357605129-26f69add5d6e'), p6:u('1515886657613-9f3515b0c78f'), p7:u('1509631179647-0177331693ae'), p8:u('1529139574466-a303027c1d8b'),
  h1:u('1534528741775-53994a69daeb',1000), h2:u('1490481651871-ab68de25d43d',1000)
};

const C={
  rose:{ar:'وردي',fr:'Rose',hex:'#e8b4bc'},black:{ar:'أسود',fr:'Noir',hex:'#1f1b20'},
  ivory:{ar:'عاجي',fr:'Ivoire',hex:'#f3ead9'},sage:{ar:'أخضر زيتي',fr:'Vert sauge',hex:'#8aa596'},
  plum:{ar:'بنفسجي',fr:'Prune',hex:'#6b3a73'},navy:{ar:'كحلي',fr:'Bleu nuit',hex:'#223052'},
  sand:{ar:'بيج',fr:'Beige',hex:'#cdb79a'},wine:{ar:'عنابي',fr:'Bordeaux',hex:'#7a2538'}
};
const PRODUCTS=[
  {id:1,ar:'حجاب شيفون حريري',fr:'Hijab chiffon soyeux',k:0,price:1200,old:1500,badge:['خصم 20%','-20%'],colors:['rose','black','ivory','sage'],img:IMG.p1,byColor:{}},
  {id:2,ar:'خمار طويل مزدوج',fr:'Khimar long double couche',k:1,price:2400,colors:['black','navy','plum','wine'],img:IMG.p2,byColor:{}},
  {id:3,ar:'حجاب جيرسي مريح',fr:'Hijab jersey confort',k:0,price:900,colors:['black','sand','sage','rose','wine'],img:IMG.p3,byColor:{}},
  {id:4,ar:'خمار ساتان فاخر',fr:'Khimar satin de luxe',k:1,price:3200,colors:['ivory','plum','navy'],img:IMG.p4,byColor:{}},
  {id:5,ar:'حجاب كريب مطرّز',fr:'Hijab crêpe brodé',k:0,price:1800,colors:['sand','wine','black'],img:IMG.p5,byColor:{}},
  {id:6,ar:'خمار صلاة بسيط',fr:'Khimar de prière',k:1,price:1500,colors:['ivory','rose','sage'],img:IMG.p6,byColor:{}},
  {id:7,ar:'حجاب قطن صيفي',fr:'Hijab coton d’été',k:0,price:800,old:1000,badge:['خصم 20%','-20%'],colors:['ivory','sand','rose','navy'],img:IMG.p7,byColor:{}},
  {id:8,ar:'خمار مخملي شتوي',fr:'Khimar velours d’hiver',k:1,price:2900,colors:['plum','wine','black'],img:IMG.p8,byColor:{}}
];
const CATS=[['all','الكل','Tout'],[0,'حجاب','Hijab'],[1,'خمار','Khimar']];

function ph(hex){
 const d=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${hex}'/><stop offset='1' stop-color='${hex}' stop-opacity='.55'/></linearGradient></defs><rect width='400' height='500' fill='#f3e6e9'/><path d='M200 70c-70 0-110 55-110 130 0 40 12 70 12 105 0 55-45 80-70 145h336c-25-65-70-90-70-145 0-35 12-65 12-105 0-75-40-130-110-130z' fill='url(#g)'/><ellipse cx='200' cy='215' rx='48' ry='62' fill='#f6dccb'/><path d='M200 70c-70 0-110 55-110 130 0 25 4 45 8 65 30-70 70-78 102-78s72 8 102 78c4-20 8-40 8-65 0-75-40-130-110-130z' fill='${hex}'/></svg>`;
 return 'data:image/svg+xml;utf8,'+encodeURIComponent(d);
}
const src=(p,ck)=>(ck&&p.byColor[ck])||p.img;
const fb=(p,ck)=>ph(C[ck||p.colors[0]].hex);
const imgTag=(p,ck,alt='',attr='')=>`<img ${attr} referrerpolicy="no-referrer" src="${src(p,ck)}" alt="${alt}" data-fb="${fb(p,ck)}" onerror="this.onerror=null;this.src=this.dataset.fb">`;
const rawImg=(url,alt,hex='#b4707c',attr='')=>`<img ${attr} referrerpolicy="no-referrer" src="${url}" alt="${alt}" data-fb="${ph(hex)}" onerror="this.onerror=null;this.src=this.dataset.fb">`;

/* ============ الولايات / Wilayas ============ */
const W=`أدرار|Adrar;الشلف|Chlef;الأغواط|Laghouat;أم البواقي|Oum El Bouaghi;باتنة|Batna;بجاية|Béjaïa;بسكرة|Biskra;بشار|Béchar;البليدة|Blida;البويرة|Bouira;تمنراست|Tamanrasset;تبسة|Tébessa;تلمسان|Tlemcen;تيارت|Tiaret;تيزي وزو|Tizi Ouzou;الجزائر|Alger;الجلفة|Djelfa;جيجل|Jijel;سطيف|Sétif;سعيدة|Saïda;سكيكدة|Skikda;سيدي بلعباس|Sidi Bel Abbès;عنابة|Annaba;قالمة|Guelma;قسنطينة|Constantine;المدية|Médéa;مستغانم|Mostaganem;المسيلة|M'Sila;معسكر|Mascara;ورقلة|Ouargla;وهران|Oran;البيض|El Bayadh;إيليزي|Illizi;برج بوعريريج|Bordj Bou Arréridj;بومرداس|Boumerdès;الطارف|El Tarf;تندوف|Tindouf;تيسمسيلت|Tissemsilt;الوادي|El Oued;خنشلة|Khenchela;سوق أهراس|Souk Ahras;تيبازة|Tipaza;ميلة|Mila;عين الدفلى|Aïn Defla;النعامة|Naâma;عين تموشنت|Aïn Témouchent;غرداية|Ghardaïa;غليزان|Relizane;تيميمون|Timimoun;برج باجي مختار|Bordj Badji Mokhtar;أولاد جلال|Ouled Djellal;بني عباس|Béni Abbès;عين صالح|In Salah;عين قزام|In Guezzam;تقرت|Touggourt;جانت|Djanet;المغير|El M'Ghair;المنيعة|El Menia`
 .split(';').map((s,i)=>{const[a,f]=s.split('|');return{code:String(i+1).padStart(2,'0'),ar:a,fr:f}});
const COMM={

let L=localStorage.getItem('lang')||'ar',F='all',cur=null;
const t=k=>T[L][k],$=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString(L==='ar'?'ar-DZ':'fr-FR')+' '+t('da');
const nm=p=>L==='ar'?p.ar:p.fr;

function applyLang(){
 document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 $('#logo').textContent=t('logo');document.title=t('logo');
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
 $('#chips').innerHTML=CATS.map(c=>`<button data-c="${c[0]}" class="${F==c[0]?'on':''}">${L==='ar'?c[1]:c[2]}</button>`).join('');
 document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>{F=b.dataset.c;applyLang()});
 $('#heroimgs').innerHTML=rawImg(IMG.h1,'Hijab')+rawImg(IMG.h2,'Hijab');
 $('#tiles').innerHTML=[[0,IMG.p3,'tileH','tileHs'],[1,IMG.p2,'tileK','tileKs']].map(x=>
  `<button class="tile" data-k="${x[0]}">${rawImg(x[1],t(x[2]))}<span>${t(x[2])}<small>${t(x[3])}</small></span></button>`).join('');
 document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{F=+b.dataset.k;applyLang();$('#shop').scrollIntoView({behavior:'smooth'})});
 $('#bandimg').innerHTML=rawImg(IMG.p4,'Hijab Élégance');
 $('#wa').href='https://wa.me/'+WHATSAPP;
 renderGrid();
 if($('#ov').classList.contains('show')&&cur)openModal(cur.id,true);
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;localStorage.setItem('lang',L);applyLang()});
function setTheme(m){document.documentElement.dataset.theme=m;localStorage.setItem('theme',m);$('#theme').textContent=m==='dark'?'☀️':'🌙'}
$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
setTheme(document.documentElement.dataset.theme||'light');

function renderGrid(){
 const list=PRODUCTS.filter(p=>F==='all'||p.k==F);
 $('#grid').innerHTML=list.map(p=>`<button class="card" data-id="${p.id}">
  <div class="ph">${imgTag(p,null,nm(p),'loading="lazy"')}${p.badge?`<span class="badge">${p.badge[L==='ar'?0:1]}</span>`:''}</div>
  <div class="b"><div class="cat">${L==='ar'?CATS[p.k+1][1]:CATS[p.k+1][2]}</div><h3>${nm(p)}</h3>
  <div class="row2"><div class="price">${fmt(p.price)}${p.old?`<span class="old">${fmt(p.old)}</span>`:''}</div>
  <div class="dots">${p.colors.map(c=>`<i style="background:${C[c].hex}"></i>`).join('')}</div></div>
  <div class="buy">${t('buy')}</div></div></button>`).join('');
 document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openModal(+c.dataset.id));
}

/* ============ نافذة الطلب ============ */
function openModal(id,keep){
 const p=PRODUCTS.find(x=>x.id===id),old=keep?collect():null;cur=p;
 $('#modal').innerHTML=`
 <div class="pic"><button class="x" type="button" aria-label="${t('close')}" id="cl">×</button><div id="pimg">${imgTag(p,old?.color,nm(p))}</div></div>
 <form id="f" novalidate>
  <h3>${nm(p)}</h3><div class="p">${fmt(p.price)}</div>
  <div class="row"><div><label for="n">${t('name')}</label><input id="n" autocomplete="given-name"></div>
  <div><label for="s">${t('sur')}</label><input id="s" autocomplete="family-name"></div></div>
  <label for="ph">${t('phone')}</label><input id="ph" type="tel" inputmode="tel" dir="ltr" maxlength="10" placeholder="05 55 12 34 56" style="text-align:start">
  <div class="row"><div><label for="w">${t('wil')}</label><select id="w"><option value="">${t('wilp')}</option>${W.map(w=>`<option value="${w.code}">${w.code} - ${L==='ar'?w.ar:w.fr}</option>`).join('')}</select></div>
  <div><label for="c">${t('com')}</label><input id="c" list="cl-list" placeholder="${t('comp')}"><datalist id="cl-list"></datalist></div></div>
  <label>${t('size')}</label>
  <div class="sizes">${SIZES.map((s,i)=>`<label><input type="radio" name="sz" value="${s}" ${i?'':'checked'}><span>${s}</span></label>`).join('')}</div>
  <label>${t('color')}</label>
  <div class="sw">${p.colors.map((c,i)=>`<label title="${C[c][L]}"><input type="radio" name="col" value="${c}" ${i?'':'checked'}><span style="background:${C[c].hex}"></span></label>`).join('')}</div>
  <div class="cn" id="cn">${C[p.colors[0]][L]}</div>
  <label>${t('qty')}</label>
  <div class="qty"><button type="button" id="mn">−</button><input id="q" type="number" min="1" max="20" value="1"><button type="button" id="pl">+</button></div>
  <div class="tot"><span>${t('total')}</span><span id="tt"></span></div>
  <button class="go" type="submit">${t('send')}</button><div class="err" id="er"></div>
 </form>`;
 $('#ov').classList.add('show');document.body.style.overflow='hidden';
 const upd=()=>{$('#tt').textContent=fmt(p.price*Math.max(1,+$('#q').value||1))};
 $('#w').onchange=()=>{const l=COMM[$('#w').value]||[];$('#cl-list').innerHTML=l.map(x=>`<option value="${x}">`).join('');$('#c').value=''};
 $('#mn').onclick=()=>{$('#q').value=Math.max(1,+$('#q').value-1);upd()};
 $('#pl').onclick=()=>{$('#q').value=Math.min(20,+$('#q').value+1);upd()};
 $('#q').oninput=upd;
 $('#f').querySelectorAll('[name=col]').forEach(r=>r.onchange=()=>{$('#cn').textContent=C[r.value][L];$('#pimg').innerHTML=imgTag(p,r.value,nm(p))});
 $('#cl').onclick=closeModal;
 $('#f').onsubmit=e=>{e.preventDefault();submit()};
 if(old){for(const k of ['n','s','ph','q'])if(old[k]!=null)$('#'+k).value=old[k];
  if(old.w){$('#w').value=old.w;$('#w').onchange();$('#c').value=old.c||''}
  for(const[n,v]of[['col',old.color],['sz',old.sz]]){const r=$(`[name=${n}][value="${v}"]`);if(r)r.checked=true}
  $('#cn').textContent=C[old.color]?.[L]||''}
 upd();
}
function collect(){const g=id=>$('#'+id)?.value;const ch=n=>document.querySelector(`[name=${n}]:checked`)?.value;
 return{n:g('n'),s:g('s'),ph:g('ph'),w:g('w'),c:g('c'),q:g('q'),sz:ch('sz'),color:ch('col')}}
function closeModal(){$('#ov').classList.remove('show');document.body.style.overflow='';cur=null}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

async function submit(){
 const v=collect(),f=$('#f');
 const bad=(id,m)=>{f.querySelectorAll('.bad').forEach(x=>x.classList.remove('bad'));$('#'+id).classList.add('bad');$('#'+id).focus();$('#er').textContent=m};
 if(v.n.trim().length<2)return bad('n',t('e_name'));
 if(v.s.trim().length<2)return bad('s',t('e_name'));
 if(!/^0[567]\d{8}$/.test(v.ph.replace(/\s/g,'')))return bad('ph',t('e_phone'));
 if(!v.w)return bad('w',t('e_wil'));
 if(v.c.trim().length<2)return bad('c',t('e_com'));
 const w=W.find(x=>x.code===v.w),q=Math.max(1,+v.q||1);
 const order={id:'C'+Date.now().toString(36).toUpperCase(),date:new Date().toISOString(),
  name:v.n.trim(),surname:v.s.trim(),phone:v.ph.replace(/\s/g,''),
  wilayaCode:w.code,wilayaAr:w.ar,wilayaFr:w.fr,commune:v.c.trim(),
  productId:cur.id,productAr:cur.ar,productFr:cur.fr,size:v.sz,
  colorAr:C[v.color].ar,colorFr:C[v.color].fr,colorHex:C[v.color].hex,
  qty:q,total:cur.price*q,status:'pending'};
 try{
  if(API_URL){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(order)});if(!r.ok)throw 0}
  else{const a=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');a.unshift(order);localStorage.setItem(STORE_KEY,JSON.stringify(a))}
 }catch(e){return $('#er').textContent='Erreur / خطأ'}
 $('#modal').innerHTML=`<div class="ok"><b>✓</b><h3>${t('okt')}</h3><p style="margin:8px 0 22px;color:var(--mute)">${t('okp')}</p><button class="go" style="max-width:220px" id="cl2">${t('close')}</button></div>`;
 $('#cl2').onclick=closeModal;
}
applyLang();
</script>
